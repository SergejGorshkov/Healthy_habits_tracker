  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            # Создаем и переходим в рабочую директорию
#            PROJECT_DIR="/home/${{ secrets.SSH_USER }}/Healthy_habits_tracker"
            PROJECT_DIR="/app"
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR
            
            # Создание файла .env
            cat > .env << EOF
            # Database
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_HOST=db
            # Django
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            # Redis
            CELERY_BROKER_URL=redis://redis:6379
            CELERY_RESULT_BACKEND=redis://redis:6379
            REDIS_URL=redis://redis:6379
            # Telegram
            TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            EOF
            
            # Копируем необходимые файлы
#            cp /home/${{ secrets.SSH_USER }}/Healthy_habits_tracker/docker-compose.yml .
#            cp /home/${{ secrets.SSH_USER }}/Healthy_habits_tracker/nginx.conf .
            cp /app/docker-compose.yml .
            cp /app/nginx.conf .
            
            # Останавливаем и удаляем старые контейнеры
            sudo docker-compose down || true
            
            # Пуллим последний образ
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
            
            # Запускаем сервисы
            sudo docker-compose up -d
            
            # Ждем и проверяем
            sleep 15
            echo "=== Container status ==="
            sudo docker-compose ps
            echo "=== Web logs ==="
            sudo docker-compose logs web || echo "No web logs"
            echo "=== Celery logs ==="
            sudo docker-compose logs celery || echo "No celery logs"
            
            # Очистка старых образов
            sudo docker image prune -f
