################################################################################################################
  # Job для сборки и публикации Docker образа
  build-and-push:
    runs-on: ubuntu-latest
#    needs: test  # Зависимость: выполняется только если задача 'test' успешна
    steps:
      - name: Checkout code  # Клонирование репозитория с исходным кодом
        uses: actions/checkout@v4

      - name: Set up Docker Buildx  # Настраивание Buildx для мульти-архитектурной сборки
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub  # Логин в DockerHub для публикации образа
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}  # Логин из GitHub Secrets
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}  # Токен из GitHub Secrets

      - name: Build and push Docker image  # Сборка и публикация в DockerHub образа с приложением
        uses: docker/build-push-action@v5
        with:  # Описание сборки
          context: .  # Контекст сборки - текущая директория
          file: ./Dockerfile  # Файл Dockerfile для сборки (в текущей директории)
          push: true  # Автоматическая публикация собранного образа в DockerHub после успешной сборки
          # Список тегов для образа. Всегда указывает на самую свежую версию образа.
          # Создает уникальный тег для каждого коммита
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          # Кэширование слоев для ускорения сборки (использует слои из образа latest в registry как кэш)
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:latest
          cache-to: type=inline  # Сохранение информации о кэше внутри собранного образа
