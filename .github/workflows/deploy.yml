name: Healthy habits tracker CI  # имя workflow
on: [ push ]  # события, на которых будет запускаться workflow

# контейнер для задач
jobs:
  # Определение job с именем "lint", который выполняет проверку кода на соответствие стандартам PEP8
  lint:
    # Запуск на последней версии Ubuntu
    runs-on: ubuntu-latest
    # Последовательность операций внутри job "lint"
    steps:
      # Шаг 1: Клонирование репозитория с исходным кодом
      - name: Check out code
        uses: actions/checkout@v4
      # Шаг 2: Установка Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4  # Устанавливает Python
        with:
          python-version: '3.12'  # Конкретная версия Python для использования
      # Шаг 3: Обновление pip до последней версии и установка линтера flake8
      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      # Шаг 4: Запуск проверки кода в текущей директории с помощью flake8 на соответствие PEP8
      - name: Run flake8
        run: flake8 .
################################################################################################################
  # Определение job с именем "test", которая выполняет тестирование приложения
  test:
    runs-on: ubuntu-latest  # Указывает, что job будет запущен на последней версии Ubuntu
    needs: lint  # Зависимость: выполняется только если задача 'lint' успешна
    # Определение контейнеров с сервисами, которые будут запущены вместе с job "test"
    services:
      postgres:  # Установка PostgreSQL
        image: postgres:16.0
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:  # Установка Redis для кэширования
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Последовательность операций внутри job "test"
    steps:
      # Шаг 1: Клонирование репозитория с исходным кодом
      - name: Check out code
        uses: actions/checkout@v4

      # Шаг 2: Установка Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Шаг 3: Кэширование pip пакетов для ускорения последующих запусков
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip  # Путь к кэшу с зависимостями pip
          # Уникальный ключ кэша на основе ОС и хэша requirements.txt
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          # Резервный ключ для поиска кэша, если точный ключ не найден
          restore-keys: |
            ${{ runner.os }}-pip-

      # Шаг 4: Установка зависимостей Python из файла requirements.txt
      - name: Install dependencies
        # Команда для выполнения в shell: 1) обновление pip до последней версии; 2) установка пакетов из requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Шаг 5: Ожидание полного запуска контейнеров PostgreSQL и Redis (для выполнения миграций и тестов),
      # чтобы приложение не пыталось подключиться к БД или к кешу до того, как она будет готова принимать соединения.
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for Postgres..."
            sleep 3
          done
#      - name: Wait for Redis
#        # Используем контейнер с redis-cli для проверки работоспособности Redis
#        run: |
#          until docker run --rm --network host redis:7-alpine redis-cli -h localhost -p 6379 ping | grep PONG; do
#            echo "Waiting for Redis..."
#            sleep 3
#          done

      # Шаг 6: Применение миграций базы данных
      - name: Run migrations
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: python manage.py migrate  # Команда Django для применения миграций БД

      # Шаг 7: Запуск тестов для проверки работоспособности приложения
      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}


          REDIS_URL: redis://redis:6379
          CELERY_BROKER_URL: redis://redis:6379


        run: python manage.py test  # Команда Django для запуска тестового набора
################################################################################################################
  # Определение job с именем "build", которая выполняет сборку и интеграцию Docker-образа
  build:
    # Указание ОС для запуска (последняя версия Ubuntu)
    runs-on: ubuntu-latest
    needs: test  # Зависимость: выполняется только если задача 'test' успешна

    # Последовательность операций внутри job "build"
    steps:
      # Шаг 1: Получение кода из репозитория
      - name: Check out code
        # Использование официального action для клонирования репозитория
        uses: actions/checkout@v4

      # Шаг 2: Авторизация в Docker Hub с использованием секретного токена
      - name: Log in to Docker Hub
        # Команда для входа в DockerHub, использующая секретный токен доступа и имя пользователя DockerHub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      # Шаг 3: Сборка Docker образа, используя тег из последнего коммита
      - name: Build Docker image
        # Команда сборки образа с тегом, содержащим: имя пользователя Docker Hub, имя приложения "myapp" и хэш коммита
        # для уникальной идентификации
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      # Шаг 4: Публикация собранного образа в Docker Hub
      - name: Push Docker image to Docker Hub
        # Команда отправки собранного образа в реестр Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
################################################################################################################
  # Задача деплоя (запускается только после успешной сборки Docker-образа)
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Установка SSH для подключения к серверу
      - name: Set up SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/Healthy_habits_tracker
            
            # Создание файла .env
            cat > .env << EOF
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            CELERY_BROKER_URL=redis://redis:6379
            CELERY_RESULT_BACKEND=redis://redis:6379
            REDIS_URL=redis://redis:6379
            TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }}
            DEBUG=False
            EOF
            
            
            # Остановка и удаление старого контейнера
            sudo docker stop myapp || echo "Контейнер myapp не был запущен"
            sudo docker rm myapp || echo "Контейнер myapp не был найден"
            
            
            # Деплой контейнера с приложением на сервере
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
            sudo docker run -d \
            --name myapp \
            -p 80:8000 \
            --env-file .env \
            ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}



            # Очистка старых образов
            sudo docker image prune -f
